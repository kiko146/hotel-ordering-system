{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="form-card"><p class="eyebrow">JOIN US</p><h1>Create your account</h1><p>Save your details and make ordering easier.</p><form method="POST"><label>Full name<input name="name" required maxlength="80" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>At least 8 characters.</small></label><button class="button full" type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>{% endblock %}
