<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">KIKO'S KIBANDASKI</a>
  <nav>
    {% for label, endpoint in navigation_links %}<a href="{{ url_for(endpoint) }}">{{ label }}</a>{% endfor %}
    <a href="{{ url_for('cart.view_cart') }}">Cart ({{ session.get('cart', {}).values()|sum }})</a>
    {% if session.get('user_id') %}<span class="welcome">Hi, {{ session.get('user_name') }}</span><a class="nav-button" href="{{ url_for('logout') }}">Logout</a>
    {% else %}<a href="{{ url_for('auth.login') }}">Login</a><a class="nav-button" href="{{ url_for('auth.register') }}">Sign up</a>{% endif %}
  </nav>
</header>
